<!doctype html>
<html lang="es">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00264D">
  <title>CNFL Campo · Mapa general</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="mapa.css?v=20261026-map1">
  <link rel="stylesheet" href="campo-shell.css?v=20261026-navfix2">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="notification-stops.js?v=20261026-map1"></script>
  <script src="mapa-data.js?v=20261026-map1"></script>
</head>
<body>
  <header class="topbar"><button id="cnflGlobalMenu" class="cnfl-global-menu" type="button" aria-label="Abrir menú"><span aria-hidden="true">☰</span></button><div><strong>CNFL CAMPO</strong><small>MAPA GENERAL</small></div></header>
  <main>
    <div class="intro"><h1>Todo el trabajo en un mapa</h1><p>Cortes, lecturas y notificaciones guardadas en este teléfono.</p></div>
    <div class="filters" id="mapFilters" role="group" aria-label="Filtrar tipo de trabajo">
      <button data-type="todos" class="active">TODOS</button><button data-type="cortes">CORTES</button><button data-type="demanda">DEMANDA</button><button data-type="residencial">RESIDENCIAL</button><button data-type="notificaciones">NOTIFICACIONES</button>
    </div>
    <div class="map-toolbar"><span id="mapCount" role="status">Cargando puntos…</span><button id="fitPoints" type="button">VER PUNTOS</button><button id="centerMe" type="button">MI UBICACIÓN</button></div>
    <div id="fieldMap" aria-label="Mapa de trabajos de campo"></div>
    <div class="map-note">El mapa de calles requiere Internet. El progreso de cada módulo sigue guardado en este dispositivo.</div>
    <div class="list-head"><h2>Puntos de trabajo</h2><button id="pendingOnly" type="button" aria-pressed="false">SOLO PENDIENTES</button></div>
    <div id="mapList" class="map-list"></div>
  </main>
  <script src="mapa.js?v=20261026-map1"></script>
  <script src="campo-shell.js?v=20261026-map1"></script>
</body>
</html>
