<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#00264D"><title>CNFL Campo · Mi jornada</title>
<link rel="stylesheet" href="journey.css?v=20261125-etapa2a"><script src="journey.js?v=20261125-etapa2a"></script></head>
<body class="cnfl-day-home"><header><strong>CNFL CAMPO</strong><small>MI JORNADA</small></header><main>
<h1 id="greeting">Mi jornada</h1><p id="intro">Elegí el trabajo y continuá con las herramientas de cada módulo.</p>
<section id="resume" class="card" hidden><h2 id="resumeTitle">Jornada en curso</h2><p id="resumeText"></p><button id="continue" class="primary">CONTINUAR TRABAJO</button><button id="closeJourney" class="ghost" type="button">CERRAR JORNADA</button><p id="closeMessage" role="status"></p></section>
<section id="start" class="card"><h2>¿Listo para trabajar?</h2><p>Elegí el tipo de orden de hoy. Mientras dure la jornada, la app te mantiene en ese trabajo.</p><div id="types" class="types"></div></section>
<details id="past" class="card" hidden><summary>Jornadas guardadas</summary><div id="pastList"></div></details>
<details id="more" class="card"><summary>Otras opciones</summary><a id="generalMap" class="secondary" href="mapa.html">Mapa general</a><a class="secondary" href="backup.html">Respaldo</a></details>
</main><script>
(function(){
 const j=window.CNFLJourney,params=new URLSearchParams(location.search);
 const hour=Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Costa_Rica',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
 document.getElementById('greeting').textContent=hour>=6&&hour<12?'Buenos días':'Mi jornada';
 const STEP={load:'Cargar órdenes',map:'Armar ruta',work:'Visitar órdenes',report:'Revisar cierre'};
 function destination(active){const older=active.date!==j.stamp()?'&continuar_anterior=1':'';const toMap=active.step==='map'&&!(j.progress(localStorage,active.module).done>0);return toMap?'mapa.html?tipo='+encodeURIComponent(active.module)+'&volver='+encodeURIComponent(active.module)+'&jornada=1'+older:j.pages[active.module]+'?jornada=1'+older;}
 function fmtDate(d){const [y,m,day]=String(d||'').split('-');const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return day?Number(day)+' '+(months[Number(m)-1]||m)+' '+y:String(d||'');}
 function reportText(a,p){return 'CNFL Campo · '+j.MODULES[a.module]+'\nJornada: '+a.date+(p.routeName?'\nRuta: '+p.routeName:'')+'\nTotal: '+p.total+'\nGestionadas: '+p.done+'\nPendientes: '+p.pending;}
 const a=j.read(localStorage).active,open=a&&!a.finishedAt,older=open&&a.date!==j.stamp();

 // Con una jornada de hoy abierta, abrir la app lleva directo a ella.
 // "Mi jornada" del menú entra con ?inicio=1 para poder cerrarla desde acá.
 if(open&&!older&&!params.has('inicio')){location.replace(destination(a));return;}

 const types=document.getElementById('types');
 Object.entries(j.MODULES).forEach(([type,title])=>{const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=()=>{
   try{
     const day=j.stamp(),previous=j.read(localStorage).active;
     if(type==='notificaciones'&&!(previous?.module===type&&previous.date===day&&!previous.finishedAt))j.prepareNotifications(localStorage,day);
     const started=j.begin(localStorage,type);
     if(!started){alert('Hay una jornada abierta. Cerrala primero.');location.reload();return;}
     if(type==='notificaciones')j.step(localStorage,'map');
     location.assign(destination(j.read(localStorage).active));
   }catch(_){alert('No se pudo guardar la jornada en este teléfono. Revisá el almacenamiento disponible.');}
 };types.append(b)});

 document.getElementById('start').hidden=!!open;
 document.getElementById('generalMap').hidden=!!open;
 if(open){
   const p=j.progress(localStorage,a.module);
   const resume=document.getElementById('resume');resume.hidden=false;
   document.getElementById('resumeTitle').textContent=older?'Quedó abierta la jornada del '+fmtDate(a.date):'Jornada en curso';
   document.getElementById('resumeText').textContent=j.MODULES[a.module]+(p.routeName?' · '+p.routeName:'')+' · '+(p.total?p.done+' de '+p.total+' gestionadas':(STEP[a.step]||'Continuar'));
   const cont=document.getElementById('continue'),close=document.getElementById('closeJourney'),msg=document.getElementById('closeMessage');
   cont.onclick=()=>location.assign(destination(a));
   if(older){
     // La de ayer: lo natural es cerrarla y guardarla; seguirla es la opción secundaria.
     close.className='primary';close.textContent='CERRAR Y GUARDAR';
     cont.className='ghost';cont.textContent='SEGUIR CON ESA JORNADA';
     resume.insertBefore(close,cont);
   }
   close.onclick=()=>{
     const current=j.read(localStorage).active;
     if(!current||current.id!==a.id||current.finishedAt){msg.textContent='La jornada cambió en otra pantalla. Actualizando…';setTimeout(()=>location.replace('campo.html?inicio=1'),800);return;}
     const now=j.progress(localStorage,a.module);
     if(!confirm(now.pending?'Quedan '+now.pending+' pendientes. ¿Cerrar la jornada de '+j.MODULES[a.module]+' y guardarla?':'¿Cerrar la jornada de '+j.MODULES[a.module]+' y guardarla?'))return;
     try{
       const saved=j.close(localStorage,{...now,report:reportText(a,now)},new Date(),older?'next-day':'user');
       if(!saved)throw Error('no cerrada');
       location.replace('campo.html?inicio=1');
     }catch(_){msg.textContent='No se pudo cerrar la jornada. Revisá el almacenamiento antes de intentarlo de nuevo.';}
   };
 }

 const past=j.saved(localStorage).slice(0,15);
 if(past.length){document.getElementById('past').hidden=false;const list=document.getElementById('pastList');past.forEach(x=>{
   const row=document.createElement('details'),title=document.createElement('summary');
   const sm=x.summary||{},route=sm.routeName?' · '+sm.routeName:'';
   title.textContent=(j.MODULES[x.module]||x.module)+' · '+fmtDate(x.date)+route+' · '+(x.finishedAt?(sm.done||0)+(sm.total?' de '+sm.total:'')+' gestionadas':'sin cerrar');
   row.append(title);
   const body=document.createElement('pre');
   body.textContent=x.report||('Esta jornada quedó guardada sin cerrar. Sus órdenes siguen en '+(j.MODULES[x.module]||'el módulo')+(x.module==='demanda'||x.module==='residencial'?' › Cargar › Rutas recientes.':'.'));
   row.append(body);list.append(row);
 });}
 const openDate=j.stamp();
 function checkNewDay(){if(document.visibilityState==='visible'&&j.stamp()!==openDate)location.reload();}
 addEventListener('pageshow',checkNewDay);document.addEventListener('visibilitychange',checkNewDay);
})();</script></body></html>
